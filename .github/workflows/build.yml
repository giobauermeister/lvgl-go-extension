name: Build packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish (leave blank to build only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node <<'NODE'
          const version = require('./package.json').version;
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version} to match package.json.`);
          }
          NODE
          for branch in main master; do
            if git show-ref --verify --quiet "refs/remotes/origin/$branch" &&
               git merge-base --is-ancestor HEAD "refs/remotes/origin/$branch"; then
              exit 0
            fi
          done
          echo "Release tags must point to a commit merged into main or master." >&2
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        if: github.event_name != 'pull_request'
        run: npm run package

      - name: Package PWA
        if: github.event_name != 'pull_request'
        run: npm run package:pwa

      - name: Upload extension installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/*.vsix
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload PWA ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/lvgl-go-pwa.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release downloads
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download tested packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
          # Both packages are uploaded as raw files; keep the PWA ZIP intact.
          skip-decompress: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          assets=("artifacts/lvgl-go-${RELEASE_TAG#v}.vsix" "artifacts/lvgl-go-pwa.zip")
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done

          if release=$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null); then
            draft=$(jq -r '.isDraft' <<< "$release")
          else
            options=(--verify-tag --draft --generate-notes --title "$RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${options[@]}"
            release='{"assets":[]}'
            draft=true
          fi

          for asset in "${assets[@]}"; do
            if ! jq -e --arg name "$(basename "$asset")" '.assets | any(.name == $name)' <<< "$release" >/dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          if [[ "$draft" == true ]]; then gh release edit "$RELEASE_TAG" --draft=false; fi
